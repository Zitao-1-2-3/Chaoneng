# Netlify 部署配置

[build]
  command = "pnpm install --prod=false && pnpm build:management"
  publish = "dist-management"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NODE_ENV = "production"

[context.production]
  command = "pnpm install --prod=false && pnpm build:management"
  publish = "dist-management"
  [context.production.environment]
    NODE_ENV = "production"

[context.develop]
  command = "pnpm install --prod=false && pnpm build:management"
  publish = "dist-management"
  [context.develop.environment]
    NODE_ENV = "development"

[context.branch-deploy]
  command = "pnpm install --prod=false && pnpm build:management"
  publish = "dist-management"

[[redirects]]
  from = "/v3/*"
  to = "/.netlify/functions/api/v3/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/v2/*"
  to = "/.netlify/functions/api/v2/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
