<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
        }
        .error-code {
            font-size: 120px;
            font-weight: bold;
            color: #409eff;
            margin-bottom: 20px;
            line-height: 1;
        }
        .error-message {
            font-size: 18px;
            color: #606266;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #409eff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #66b1ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <div class="error-message">抱歉，您访问的页面不存在。</div>
        <a href="/#/" class="btn" onclick="goHome(event)">返回首页</a>
    </div>
    <script>
        function goHome(e) {
            e.preventDefault();
            // 尝试使用 Vue Router（如果已加载）
            if (window.location.hash) {
                window.location.hash = '#/';
            } else {
                window.location.href = '/#/';
            }
        }
    </script>
</body>
</html>
